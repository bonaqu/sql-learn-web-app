name: Apply Curriculum 2 Integration

on:
  push:
    branches: [agent/curriculum-2-complete-syllabus]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/curriculum-2-complete-syllabus
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply integration patch
        run: node scripts/integrate-curriculum-2.mjs
      - name: Commit integrated tree
        shell: bash
        run: |
          rm -f scripts/integrate-curriculum-2.mjs .github/workflows/apply-curriculum-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate complete SQL catalog across the app"
          git push origin HEAD:agent/curriculum-2-complete-syllabus
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate integrated repository
        run: npm run check
      - name: Build production app
        run: npm run build
