name: Apply Assessment Session Merge Patch

on:
  push:
    branches: [agent/assessment-center-v1]

permissions:
  contents: write

concurrency:
  group: apply-assessment-session-merge-patch
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/assessment-center-v1
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Apply exact session merge patch
        run: node scripts/apply-assessment-session-merge-patch.mjs

      - name: Verify only assessment engine changed
        shell: bash
        run: |
          git diff --check
          git diff --exit-code -- .github/workflows/apply-assessment-session-merge-patch.yml scripts/apply-assessment-session-merge-patch.mjs
          git diff --name-only | grep -Fx 'src/lib/assessment.ts'
          test "$(git diff --name-only | wc -l)" -eq 1

      - name: Commit patched assessment engine
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/assessment.ts
          git commit -m 'fix: merge assessment updates against latest session snapshot'
          git push origin HEAD:agent/assessment-center-v1
