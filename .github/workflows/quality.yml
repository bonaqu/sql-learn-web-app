name: Pull Request Quality

on:
  pull_request:
    branches: [bonaqu_projects]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Course, browser, build and Worker validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript and course validation
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee typescript-check.log

      - name: Production build
        shell: bash
        env:
          VITE_API_BASE: http://127.0.0.1:8787
        run: |
          set -o pipefail
          npm run build 2>&1 | tee production-build.log

      - name: Verify expected build output
        shell: bash
        run: |
          test -f dist/index.html
          test -n "$(find dist/assets -type f -name '*.js' -print -quit)"
          test -n "$(find dist/assets -type f -name '*.css' -print -quit)"

      - name: Enforce bundle budgets and lazy boundaries
        shell: bash
        run: |
          set -o pipefail
          npm run validate:bundle 2>&1 | tee bundle-budget.log

      - name: Cloudflare Worker dry run
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --dry-run --config wrangler.jsonc 2>&1 | tee wrangler-dry-run.log

      - name: Build real dialect engine image
        shell: bash
        run: |
          set -o pipefail
          docker build --platform linux/amd64 -t sql-academy-dialect-engines:pr containers/dialect-engines 2>&1 | tee dialect-engine-build.log

      - name: Run all PostgreSQL and MySQL contracts
        shell: bash
        run: |
          set -o pipefail
          npm run validate:real-dialect-engines 2>&1 | tee dialect-engine-integration.log

      - name: Verify PWA metadata
        shell: bash
        run: npm run validate:metadata -- --dist

      - name: Prepare local D1 database
        run: npx wrangler d1 migrations apply sql-academy --local --config wrangler.jsonc

      - name: Install Chromium for responsive QA
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile browser tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee playwright.log

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-browser-evidence-${{ github.run_attempt }}
          path: |
            test-results
            wrangler-playwright.log
            wrangler-internal-playwright.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-quality-diagnostics
          path: |
            typescript-check.log
            production-build.log
            bundle-budget.log
            wrangler-dry-run.log
            dialect-engine-build.log
            dialect-engine-integration.log
            playwright.log
            wrangler-playwright.log
            wrangler-internal-playwright.log
            test-results
          if-no-files-found: ignore
          retention-days: 7
