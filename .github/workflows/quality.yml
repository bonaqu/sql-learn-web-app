name: Pull Request Quality

on:
  pull_request:
    branches: [bonaqu_projects]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Diagnose deployed CR2C surfaces and lifecycles
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOY_URL: https://sql-learn-web-app.bonaqu.workers.dev
      PAGE_URL: https://bonaqu.github.io/sql-learn-web-app/
      EXPECTED_ALLOWED_ORIGIN: https://bonaqu.github.io
      EXPECT_EMAIL_VERIFICATION: 'false'
      EXPECT_SMS_VERIFICATION: 'false'
      EXPECT_TURNSTILE: 'false'
      EXPECT_ADMIN_CONSOLE: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies for dialect smoke
        run: npm install --no-audit --no-fund

      - name: GitHub Pages public surface
        shell: bash
        run: |
          set -o pipefail
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 5 --retry-all-errors \
            "$PAGE_URL" | tee deployed-pages.html
          grep -q '<div id="root"></div>' deployed-pages.html
          grep -q 'SQL Academy' deployed-pages.html

      - name: Commercial runtime and hidden contact routes
        run: node scripts/commercial-runtime-production-smoke.mjs 2>&1 | tee cloudflare-commercial-diagnostic.log

      - name: Core frontend, auth and curriculum
        run: node scripts/cloudflare-production-smoke.mjs 2>&1 | tee cloudflare-core-diagnostic.log

      - name: Concept history
        run: node scripts/concept-progress-production-smoke.mjs 2>&1 | tee cloudflare-concepts-diagnostic.log

      - name: Checkpoint lifecycle
        run: node scripts/checkpoint-production-smoke.mjs 2>&1 | tee cloudflare-checkpoint-diagnostic.log

      - name: Capstone lifecycle
        run: node scripts/capstone-production-smoke.mjs 2>&1 | tee cloudflare-capstone-diagnostic.log

      - name: Assessment calibration
        run: node scripts/assessment-calibration-production-smoke.mjs 2>&1 | tee cloudflare-assessment-diagnostic.log

      - name: Learning analytics
        run: node scripts/learning-analytics-production-smoke.mjs 2>&1 | tee cloudflare-analytics-diagnostic.log

      - name: Dialect CI reference previews
        run: npx tsx scripts/dialect-labs-free-production-smoke.ts 2>&1 | tee cloudflare-dialect-diagnostic.log

      - name: Mastery progress
        run: node scripts/mastery-progress-production-smoke.mjs 2>&1 | tee cloudflare-mastery-diagnostic.log

      - name: Onboarding lifecycle
        run: node scripts/onboarding-production-smoke.mjs 2>&1 | tee cloudflare-onboarding-diagnostic.log

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cr2c-deployment-diagnostic
          path: |
            deployed-pages.html
            cloudflare-*.json
            cloudflare-*.txt
            cloudflare-*.html
            cloudflare-*.log
          if-no-files-found: warn
          retention-days: 3
