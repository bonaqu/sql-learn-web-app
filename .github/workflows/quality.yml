name: Pull Request Quality

on:
  pull_request:
    branches: [bonaqu_projects]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Diagnose deployed CR2A production lifecycles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_URL: https://sql-learn-web-app.bonaqu.workers.dev
      EXPECTED_ALLOWED_ORIGIN: https://bonaqu.github.io
      EXPECT_EMAIL_VERIFICATION: 'false'
      EXPECT_SMS_VERIFICATION: 'false'
      EXPECT_TURNSTILE: 'false'
      EXPECT_ADMIN_CONSOLE: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run commercial runtime smoke
        run: node scripts/commercial-runtime-production-smoke.mjs 2>&1 | tee cloudflare-commercial-diagnostic.log

      - name: Run core frontend, auth and curriculum smoke
        run: node scripts/cloudflare-production-smoke.mjs 2>&1 | tee cloudflare-core-diagnostic.log

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cr2a-production-diagnostic
          path: |
            cloudflare-*.json
            cloudflare-*.txt
            cloudflare-*.html
            cloudflare-*.log
          if-no-files-found: warn
          retention-days: 3
