name: Apply guided UX once

on:
  push:
    branches:
      - agent/commercial-readiness

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commercial branch
        uses: actions/checkout@v4
        with:
          ref: agent/commercial-readiness
          fetch-depth: 0

      - name: Apply reviewed guided UX patch
        shell: bash
        run: |
          cat <<'PATCH_B64' | base64 -d | gzip -d > /tmp/guided-ux.patch
          