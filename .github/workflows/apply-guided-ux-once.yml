name: Apply guided learner UX once

on:
  push:
    branches:
      - agent/commercial-readiness

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout commercial branch
        uses: actions/checkout@v4
        with:
          ref: agent/commercial-readiness
          fetch-depth: 0

      - name: Apply and validate guided UX
        shell: bash
        run: |
          set +e
          cat > /tmp/guided-ux.patch.gz.b64 <<'PATCH'

PATCH
          base64 -d /tmp/guided-ux.patch.gz.b64 | gzip -d > /tmp/guided-ux.patch
          git apply --check /tmp/guided-ux.patch > /tmp/apply.log 2>&1
          APPLY_STATUS=$?
          if [ "$APPLY_STATUS" -eq 0 ]; then
            git apply /tmp/guided-ux.patch >> /tmp/apply.log 2>&1
            APPLY_STATUS=$?
          fi
          rm -f .commercial-source-run-id

          INSTALL_STATUS=99
          CHECK_STATUS=99
          BUILD_STATUS=99
          BUNDLE_STATUS=99
          if [ "$APPLY_STATUS" -eq 0 ]; then
            npm install --no-audit --no-fund > /tmp/install.log 2>&1
            INSTALL_STATUS=$?
          fi
          if [ "$INSTALL_STATUS" -eq 0 ]; then
            npm run check > /tmp/check.log 2>&1
            CHECK_STATUS=$?
          fi
          if [ "$CHECK_STATUS" -eq 0 ]; then
            npm run build > /tmp/build.log 2>&1
            BUILD_STATUS=$?
          fi
          if [ "$BUILD_STATUS" -eq 0 ]; then
            npm run validate:bundle > /tmp/bundle.log 2>&1
            BUNDLE_STATUS=$?
          fi

          if [ "$APPLY_STATUS" -eq 0 ] && [ "$INSTALL_STATUS" -eq 0 ] && [ "$CHECK_STATUS" -eq 0 ] && [ "$BUILD_STATUS" -eq 0 ] && [ "$BUNDLE_STATUS" -eq 0 ]; then
            rm -f .guided-ux-diagnostics.txt
            rm .github/workflows/apply-guided-ux-once.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --cached --check
            git commit -m "Add guided learner journey and simplify navigation"
            git push origin HEAD:agent/commercial-readiness
            exit 0
          fi

          git reset --hard HEAD
          {
            echo "apply=$APPLY_STATUS install=$INSTALL_STATUS check=$CHECK_STATUS build=$BUILD_STATUS bundle=$BUNDLE_STATUS"
            for file in apply install check build bundle; do
              echo
              echo "===== $file ====="
              test -f "/tmp/$file.log" && tail -n 160 "/tmp/$file.log" || true
            done
          } > .guided-ux-diagnostics.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .guided-ux-diagnostics.txt
          git commit -m "Record guided UX validation diagnostics"
          git push origin HEAD:agent/commercial-readiness
          exit 1
