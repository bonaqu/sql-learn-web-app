name: Apply Cloudflare PBKDF2 Patch

on:
  push:
    branches: [hotfix/cloudflare-pbkdf2-chunks]

permissions:
  contents: write

concurrency:
  group: apply-cloudflare-pbkdf2-patch
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/cloudflare-pbkdf2-chunks
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Apply exact KDF patch
        run: node scripts/apply-cloudflare-pbkdf2-patch.mjs

      - name: Verify only intended source changed
        shell: bash
        run: |
          git diff --check
          git diff --exit-code -- .github/workflows/apply-cloudflare-pbkdf2-patch.yml scripts/apply-cloudflare-pbkdf2-patch.mjs
          git diff --name-only | grep -Fx 'worker/auth.ts'
          test "$(git diff --name-only | wc -l)" -eq 1

      - name: Commit patched auth implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/auth.ts
          git commit -m 'fix: chain PBKDF2 within Cloudflare iteration limits'
          git push origin HEAD:hotfix/cloudflare-pbkdf2-chunks
