name: Apply Curriculum README

on:
  push:
    branches: [agent/structured-curriculum-project-lab]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structured-curriculum-project-lab
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/apply-curriculum-readme.mjs
      - shell: bash
        run: |
          test "$(git diff --name-only)" = "README.md"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git commit -m "Document Curriculum Studio and Project Lab"
          git push origin HEAD:agent/structured-curriculum-project-lab
