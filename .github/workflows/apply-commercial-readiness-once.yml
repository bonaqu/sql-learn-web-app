name: Apply commercial readiness patch once

on:
  pull_request:
    branches:
      - bonaqu_projects
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/commercial-readiness'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commercial branch
        uses: actions/checkout@v4
        with:
          ref: agent/commercial-readiness
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/commercial-patch/diff-021.b64')
          value = path.read_text(encoding='ascii')
          assert len(value) == 3000
          assert value[2698] == 'T'
          path.write_text(value[:2698] + 'm' + value[2699:], encoding='ascii')
          PY
          cat .github/commercial-patch/diff-*.b64 | base64 --decode > commercial.patch.gz
          wc -c commercial.patch.gz | tee commercial-patch-size.txt
          sha256sum commercial.patch.gz | tee commercial-patch-sha256.txt
          echo 'b8f94d52194aa1b54abd68cea79d58908a8dcef15b1a008b3cc0db3ec319c5af  commercial.patch.gz' | sha256sum --check --strict
          gzip --test commercial.patch.gz
          gzip --decompress --stdout commercial.patch.gz > /tmp/commercial.patch.raw
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/commercial.patch.raw').read_text(encoding='utf-8', errors='surrogateescape')
          sections = []
          current = []
          for line in source.splitlines(keepends=True):
              if line.startswith('--- a/') and current:
                  sections.append(current)
                  current = []
              current.append(line)
          if current:
              sections.append(current)
          kept = []
          removed = []
          for section in sections:
              header = section[0] if section else ''
              if header.startswith('--- a/') and '.tsbuildinfo' in header:
                  removed.append(header.strip())
              else:
                  kept.extend(section)
          assert len(removed) == 3, removed
          Path('/tmp/commercial.patch').write_text(''.join(kept), encoding='utf-8', errors='surrogateescape')
          print('Excluded local build caches:', *removed, sep='\n- ')
          PY
          git apply --check --verbose /tmp/commercial.patch 2>&1 | tee commercial-apply-check.txt

      - name: Upload patch diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-patch-diagnostics
          path: |
            commercial.patch.gz
            commercial-patch-size.txt
            commercial-patch-sha256.txt
            commercial-apply-check.txt
          if-no-files-found: ignore
          retention-days: 2

      - name: Apply product changes and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/commercial.patch
          rm -rf .github/commercial-patch
          rm -f .github/workflows/export-commercial-source-once.yml
          rm -f .github/workflows/apply-commercial-readiness-once.yml
          rm -f commercial.patch.gz commercial-patch-size.txt commercial-patch-sha256.txt commercial-apply-check.txt
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add guided learning UX and commercial readiness baseline'
          git push origin HEAD:agent/commercial-readiness
