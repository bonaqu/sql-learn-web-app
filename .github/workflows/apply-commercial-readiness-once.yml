name: Export exact commercial PR head

on:
  pull_request:
    branches:
      - bonaqu_projects
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/commercial-readiness'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commercial branch
        uses: actions/checkout@v4
        with:
          ref: agent/commercial-readiness
          fetch-depth: 0

      - name: Build clean source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.github/commercial-patch \
            --exclude=.github/workflows/apply-commercial-readiness-once.yml \
            --exclude=.github/workflows/export-commercial-source-once.yml \
            --exclude='*.tsbuildinfo' \
            -czf commercial-pr-head.tar.gz .
          sha256sum commercial-pr-head.tar.gz > commercial-pr-head.sha256

      - name: Upload exact PR head
        uses: actions/upload-artifact@v4
        with:
          name: commercial-pr-head-source
          path: |
            commercial-pr-head.tar.gz
            commercial-pr-head.sha256
          retention-days: 2
          if-no-files-found: error
