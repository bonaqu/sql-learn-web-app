name: Repository Labels

on:
  workflow_dispatch:
  push:
    branches:
      - bonaqu_projects
    paths:
      - .github/workflows/repository-labels.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: repository-labels
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create or update dependency label
        run: >-
          gh label create dependencies
          --color "0366d6"
          --description "Pull requests that update project dependencies"
          --force

      - name: Backfill open Dependabot pull requests
        shell: bash
        run: |
          gh pr list --state open --author "app/dependabot" --json number --jq '.[].number' |
          while read -r pr_number; do
            gh pr edit "${pr_number}" --add-label dependencies
          done
