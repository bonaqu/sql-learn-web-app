name: Apply Curriculum Cloud UI

on:
  push:
    branches: [agent/structured-curriculum-project-lab]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structured-curriculum-project-lab
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/apply-curriculum-cloud-ui.mjs
      - shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' scripts/validate-curriculum.ts src/components/CurriculumPortal.tsx src/styles-curriculum.css tests/e2e/curriculum.spec.ts | sort)"
          test "$changed" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/validate-curriculum.ts src/components/CurriculumPortal.tsx src/styles-curriculum.css tests/e2e/curriculum.spec.ts
          git commit -m "Add curriculum cloud sync UI and cross-device test"
          git push origin HEAD:agent/structured-curriculum-project-lab
