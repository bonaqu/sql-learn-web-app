name: Regenerate Notices Temporary

on:
  push:
    branches:
      - dependabot/npm_and_yarn/lucide-react-1.31.0

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install exact locked dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate third-party artifacts
        run: node scripts/generate-third-party-notices.mjs

      - name: Commit generated artifacts
        shell: bash
        run: |
          if git diff --quiet -- THIRD_PARTY_NOTICES.md docs/third-party-dependencies.json; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add THIRD_PARTY_NOTICES.md docs/third-party-dependencies.json
          git commit -m "chore: regenerate third-party dependency notices"
          git push origin "HEAD:${GITHUB_REF_NAME}"
