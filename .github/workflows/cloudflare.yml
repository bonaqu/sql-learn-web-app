name: Deploy Cloudflare Full Stack

on:
  push:
    branches: [bonaqu_projects]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report Cloudflare deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'deployment/cloudflare',
              description: 'Building and smoke-testing Cloudflare Worker'
            });

      - name: Validate deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Ensure D1 database exists
        shell: bash
        run: |
          npx wrangler d1 list --json > d1.json
          D1_ID=$(node -e "const x=require('./d1.json'); const d=x.find(v=>v.name==='sql-academy'); if(d) process.stdout.write(d.uuid||d.id)")
          if [ -z "$D1_ID" ]; then
            npx wrangler d1 create sql-academy
            npx wrangler d1 list --json > d1.json
            D1_ID=$(node -e "const x=require('./d1.json'); const d=x.find(v=>v.name==='sql-academy'); if(d) process.stdout.write(d.uuid||d.id)")
          fi
          test -n "$D1_ID"
          echo "D1_ID=$D1_ID" >> "$GITHUB_ENV"

      - name: Ensure KV namespace exists
        shell: bash
        run: |
          npx wrangler kv namespace list > kv.json
          KV_ID=$(node -e "const x=require('./kv.json'); const d=x.find(v=>String(v.title).toLowerCase().includes('sql-academy-settings')); if(d) process.stdout.write(d.id)")
          if [ -z "$KV_ID" ]; then
            npx wrangler kv namespace create sql-academy-settings
            npx wrangler kv namespace list > kv.json
            KV_ID=$(node -e "const x=require('./kv.json'); const d=x.find(v=>v.name==='sql-academy-settings' || String(v.title).toLowerCase().includes('sql-academy-settings')); if(d) process.stdout.write(d.id)")
          fi
          test -n "$KV_ID"
          echo "KV_ID=$KV_ID" >> "$GITHUB_ENV"

      - name: Generate production Wrangler config
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const config = {
            $schema: './node_modules/wrangler/config-schema.json',
            name: 'sql-learn-web-app',
            main: 'worker/index.ts',
            compatibility_date: '2026-07-24',
            assets: {
              directory: './dist',
              binding: 'ASSETS',
              not_found_handling: 'single-page-application',
              run_worker_first: ['/api/*']
            },
            d1_databases: [{
              binding: 'DB',
              database_name: 'sql-academy',
              database_id: process.env.D1_ID,
              migrations_dir: 'migrations'
            }],
            kv_namespaces: [{ binding: 'SETTINGS', id: process.env.KV_ID }],
            ai: { binding: 'AI' },
            observability: { enabled: true, head_sampling_rate: 1 }
          };
          fs.writeFileSync('wrangler.deploy.jsonc', JSON.stringify(config, null, 2));
          NODE

      - name: Validate production Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.deploy.jsonc

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply sql-academy --remote --config wrangler.deploy.jsonc

      - name: Deploy Worker and static assets
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --config wrangler.deploy.jsonc 2>&1 | tee cloudflare-deploy.log
          DEPLOY_URL=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' cloudflare-deploy.log | tail -n 1)
          test -n "$DEPLOY_URL"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Smoke-test Cloudflare frontend, auth and curriculum API
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/cloudflare-production-smoke.mjs

      - name: Smoke-test executable checkpoint report lifecycle
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/checkpoint-production-smoke.mjs

      - name: Smoke-test Mastery progress evidence lifecycle
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/mastery-progress-production-smoke.mjs

      - name: Upload deployment diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-deployment-diagnostics
          path: |
            cloudflare-*.json
            cloudflare-*.txt
            cloudflare-*.html
            cloudflare-*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Report Cloudflare deployment result
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === 'success';
            let description = success
              ? 'Cloudflare deployed; curriculum, checkpoints and Mastery evidence verified'
              : 'Cloudflare deployment or production smoke failed';
            try {
              const fs = require('fs');
              const masteryStage = fs.existsSync('cloudflare-mastery-stage.txt')
                ? fs.readFileSync('cloudflare-mastery-stage.txt', 'utf8').trim()
                : '';
              const checkpointStage = fs.existsSync('cloudflare-checkpoint-stage.txt')
                ? fs.readFileSync('cloudflare-checkpoint-stage.txt', 'utf8').trim()
                : '';
              const curriculumStage = fs.existsSync('cloudflare-smoke-stage.txt')
                ? fs.readFileSync('cloudflare-smoke-stage.txt', 'utf8').trim()
                : '';
              const stage = masteryStage || checkpointStage || curriculumStage;
              if (!success && stage) description = `Cloudflare smoke failed at ${stage}`.slice(0, 140);
            } catch {}
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'deployment/cloudflare',
              description
            };
            if (process.env.DEPLOY_URL) params.target_url = process.env.DEPLOY_URL;
            await github.rest.repos.createCommitStatus(params);