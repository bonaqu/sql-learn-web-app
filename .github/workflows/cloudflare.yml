name: Deploy Cloudflare Full Stack
on:
  push:
    branches: [bonaqu_projects]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
      - name: Ensure D1 database exists
        shell: bash
        run: |
          npx wrangler d1 list --json > d1.json
          D1_ID=$(node -e "const x=require('./d1.json'); const d=x.find(v=>v.name==='sql-academy'); if(d) process.stdout.write(d.uuid||d.id)")
          if [ -z "$D1_ID" ]; then
            npx wrangler d1 create sql-academy
            npx wrangler d1 list --json > d1.json
            D1_ID=$(node -e "const x=require('./d1.json'); const d=x.find(v=>v.name==='sql-academy'); if(d) process.stdout.write(d.uuid||d.id)")
          fi
          test -n "$D1_ID"
          echo "D1_ID=$D1_ID" >> "$GITHUB_ENV"
      - name: Ensure KV namespace exists
        shell: bash
        run: |
          npx wrangler kv namespace list > kv.json
          KV_ID=$(node -e "const x=require('./kv.json'); const d=x.find(v=>String(v.title).toLowerCase().includes('sql-academy-settings')); if(d) process.stdout.write(d.id)")
          if [ -z "$KV_ID" ]; then
            npx wrangler kv namespace create sql-academy-settings
            npx wrangler kv namespace list > kv.json
            KV_ID=$(node -e "const x=require('./kv.json'); const d=x.find(v=>String(v.title).toLowerCase().includes('sql-academy-settings')); if(d) process.stdout.write(d.id)")
          fi
          test -n "$KV_ID"
          echo "KV_ID=$KV_ID" >> "$GITHUB_ENV"
      - name: Generate production Wrangler config
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const config = {
            $schema: './node_modules/wrangler/config-schema.json',
            name: 'sql-learn-web-app',
            main: 'worker/index.ts',
            compatibility_date: '2026-07-24',
            assets: { directory: './dist', binding: 'ASSETS', not_found_handling: 'single-page-application', run_worker_first: ['/api/*'] },
            d1_databases: [{ binding: 'DB', database_name: 'sql-academy', database_id: process.env.D1_ID, migrations_dir: 'migrations' }],
            kv_namespaces: [{ binding: 'SETTINGS', id: process.env.KV_ID }],
            ai: { binding: 'AI' },
            observability: { enabled: true }
          };
          fs.writeFileSync('wrangler.deploy.jsonc', JSON.stringify(config, null, 2));
          NODE
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply sql-academy --remote --config wrangler.deploy.jsonc
      - name: Deploy Worker and assets
        run: npx wrangler deploy --config wrangler.deploy.jsonc
