name: Deploy Cloudflare Full Stack

on:
  push:
    branches: [bonaqu_projects]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report Cloudflare deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'deployment/cloudflare',
              description: 'Building and smoke-testing Cloudflare Worker'
            });

      - name: Validate deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Ensure D1 database exists
        shell: bash
        run: |
          npx wrangler d1 list --json > d1.json
          D1_ID=$(node -e "const x=require('./d1.json'); const d=x.find(v=>v.name==='sql-academy'); if(d) process.stdout.write(d.uuid||d.id)")
          if [ -z "$D1_ID" ]; then
            npx wrangler d1 create sql-academy
            npx wrangler d1 list --json > d1.json
            D1_ID=$(node -e "const x=require('./d1.json'); const d=x.find(v=>v.name==='sql-academy'); if(d) process.stdout.write(d.uuid||d.id)")
          fi
          test -n "$D1_ID"
          echo "D1_ID=$D1_ID" >> "$GITHUB_ENV"

      - name: Ensure KV namespace exists
        shell: bash
        run: |
          npx wrangler kv namespace list > kv.json
          KV_ID=$(node -e "const x=require('./kv.json'); const d=x.find(v=>String(v.title).toLowerCase().includes('sql-academy-settings')); if(d) process.stdout.write(d.id)")
          if [ -z "$KV_ID" ]; then
            npx wrangler kv namespace create sql-academy-settings
            npx wrangler kv namespace list > kv.json
            KV_ID=$(node -e "const x=require('./kv.json'); const d=x.find(v=>v.name==='sql-academy-settings' || String(v.title).toLowerCase().includes('sql-academy-settings')); if(d) process.stdout.write(d.id)")
          fi
          test -n "$KV_ID"
          echo "KV_ID=$KV_ID" >> "$GITHUB_ENV"

      - name: Generate production Wrangler config
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const config = {
            $schema: './node_modules/wrangler/config-schema.json',
            name: 'sql-learn-web-app',
            main: 'worker/index.ts',
            compatibility_date: '2026-07-24',
            assets: {
              directory: './dist',
              binding: 'ASSETS',
              not_found_handling: 'single-page-application',
              run_worker_first: ['/api/*']
            },
            d1_databases: [{
              binding: 'DB',
              database_name: 'sql-academy',
              database_id: process.env.D1_ID,
              migrations_dir: 'migrations'
            }],
            kv_namespaces: [{ binding: 'SETTINGS', id: process.env.KV_ID }],
            ai: { binding: 'AI' },
            observability: { enabled: true, head_sampling_rate: 1 }
          };
          fs.writeFileSync('wrangler.deploy.jsonc', JSON.stringify(config, null, 2));
          NODE

      - name: Validate production Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.deploy.jsonc

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply sql-academy --remote --config wrangler.deploy.jsonc

      - name: Deploy Worker and static assets
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --config wrangler.deploy.jsonc 2>&1 | tee cloudflare-deploy.log
          DEPLOY_URL=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' cloudflare-deploy.log | tail -n 1)
          test -n "$DEPLOY_URL"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Smoke-test Cloudflare frontend, auth and API
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_URL"
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 5 --retry-all-errors \
            "$DEPLOY_URL/" > cloudflare-index.html
          grep -q '<div id="root"></div>' cloudflare-index.html

          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 5 --retry-all-errors \
            "$DEPLOY_URL/api/health" > cloudflare-health.json
          node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('cloudflare-health.json', 'utf8'));
          if (!health.ok || !health.d1 || !health.kv || !health.ai || health.progressVersion !== 4) {
            console.error('Unhealthy Cloudflare deployment:', health);
            process.exit(1);
          }
          NODE

          UNAUTH_STATUS=""
          for ATTEMPT in $(seq 1 12); do
            UNAUTH_STATUS=$(curl --silent --output cloudflare-unauthorized.json --write-out '%{http_code}' \
              "$DEPLOY_URL/api/auth/session")
            if [ "$UNAUTH_STATUS" = "401" ]; then
              break
            fi
            echo "Auth route not propagated yet (attempt $ATTEMPT/12, HTTP $UNAUTH_STATUS)"
            sleep 5
          done
          test "$UNAUTH_STATUS" = "401"

          SMOKE_USERNAME="smoke_$(date +%s)_${GITHUB_RUN_ATTEMPT}"
          SMOKE_PASSWORD=$(node -e "process.stdout.write(require('crypto').randomBytes(28).toString('base64url') + '!aA1')")
          export SMOKE_USERNAME SMOKE_PASSWORD
          node - <<'NODE' > cloudflare-register-payload.json
          process.stdout.write(JSON.stringify({
            username: process.env.SMOKE_USERNAME,
            password: process.env.SMOKE_PASSWORD,
            displayName: 'Deployment Smoke',
            deviceName: 'GitHub Actions'
          }));
          NODE

          REGISTER_STATUS=$(curl --silent --show-error --location \
            --request POST \
            --header 'content-type: application/json' \
            --data @cloudflare-register-payload.json \
            --dump-header cloudflare-register-headers.txt \
            --output cloudflare-register.json \
            --write-out '%{http_code}' \
            "$DEPLOY_URL/api/auth/register")
          printf '%s\n' "$REGISTER_STATUS" > cloudflare-register-status.txt
          if [ "$REGISTER_STATUS" != "201" ]; then
            echo "Registration smoke failed with HTTP $REGISTER_STATUS"
            cat cloudflare-register-headers.txt || true
            cat cloudflare-register.json || true
            exit 1
          fi

          AUTH_TOKEN=$(node -e "const x=require('./cloudflare-register.json'); if(x.session?.token) process.stdout.write(x.session.token)")
          RECOVERY_CODE=$(node -e "const x=require('./cloudflare-register.json'); if(x.recoveryCodes?.[0]) process.stdout.write(x.recoveryCodes[0])")
          test -n "$AUTH_TOKEN"
          test -n "$RECOVERY_CODE"
          export AUTH_TOKEN RECOVERY_CODE

          curl --fail --silent --show-error --location \
            --header "authorization: Bearer $AUTH_TOKEN" \
            "$DEPLOY_URL/api/auth/session" > cloudflare-session.json
          node - <<'NODE'
          const session = require('./cloudflare-session.json');
          if (session.user?.username !== process.env.SMOKE_USERNAME || !session.session?.id) {
            console.error('Invalid authenticated session:', session);
            process.exit(1);
          }
          NODE

          curl --fail --silent --show-error --location \
            --header "authorization: Bearer $AUTH_TOKEN" \
            "$DEPLOY_URL/api/user/progress" > cloudflare-progress.json
          node - <<'NODE'
          const progress = require('./cloudflare-progress.json');
          if (progress.revision !== 0 || progress.progress !== null) {
            console.error('Unexpected initial progress:', progress);
            process.exit(1);
          }
          NODE

          node - <<'NODE' > cloudflare-delete-payload.json
          process.stdout.write(JSON.stringify({
            currentPassword: process.env.SMOKE_PASSWORD,
            recoveryCode: process.env.RECOVERY_CODE,
            confirm: 'DELETE'
          }));
          NODE
          curl --fail --silent --show-error --location \
            --request DELETE \
            --header "authorization: Bearer $AUTH_TOKEN" \
            --header 'content-type: application/json' \
            --data @cloudflare-delete-payload.json \
            "$DEPLOY_URL/api/profile" > cloudflare-delete.json
          node -e "const x=require('./cloudflare-delete.json'); if(!x.ok) process.exit(1)"

      - name: Upload deployment diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-deployment-diagnostics
          path: |
            cloudflare-deploy.log
            cloudflare-index.html
            cloudflare-health.json
            cloudflare-unauthorized.json
            cloudflare-register-payload.json
            cloudflare-register-status.txt
            cloudflare-register-headers.txt
            cloudflare-register.json
            cloudflare-session.json
            cloudflare-progress.json
            cloudflare-delete.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Report Cloudflare deployment result
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const success = process.env.JOB_STATUS === 'success';
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'deployment/cloudflare',
              description: success ? 'Cloudflare Worker deployed and auth smoke-tested' : 'Cloudflare deployment failed'
            };
            if (process.env.DEPLOY_URL) params.target_url = process.env.DEPLOY_URL;
            await github.rest.repos.createCommitStatus(params);
