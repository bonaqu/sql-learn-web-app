name: Deploy Cloudflare Free Stack

on:
  push:
    branches: [bonaqu_projects]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy free-tier Worker
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS || 'https://bonaqu.github.io' }}
      FEATURE_EMAIL_VERIFICATION: ${{ vars.FEATURE_EMAIL_VERIFICATION || 'off' }}
      FEATURE_SMS_VERIFICATION: ${{ vars.FEATURE_SMS_VERIFICATION || 'off' }}
      FEATURE_TURNSTILE: ${{ vars.FEATURE_TURNSTILE || 'off' }}
      FEATURE_ADMIN_CONSOLE: ${{ vars.FEATURE_ADMIN_CONSOLE || 'off' }}
      CONTACT_REGISTRATION_POLICY: ${{ vars.CONTACT_REGISTRATION_POLICY || 'optional' }}
      TURNSTILE_EXPECTED_HOSTNAMES: ${{ vars.TURNSTILE_EXPECTED_HOSTNAMES }}
      ADMIN_ALLOWED_USER_IDS: ${{ vars.ADMIN_ALLOWED_USER_IDS }}
      RETENTION_CONTACT_EVENTS_DAYS: ${{ vars.RETENTION_CONTACT_EVENTS_DAYS || '30' }}
      RETENTION_UNCONSUMED_CONTACT_HOURS: ${{ vars.RETENTION_UNCONSUMED_CONTACT_HOURS || '24' }}
      RETENTION_CONSUMED_CHALLENGE_HOURS: ${{ vars.RETENTION_CONSUMED_CHALLENGE_HOURS || '24' }}
      RETENTION_EXPIRED_SESSION_HOURS: ${{ vars.RETENTION_EXPIRED_SESSION_HOURS || '0' }}
      RETENTION_CLEANUP_BATCH_SIZE: ${{ vars.RETENTION_CLEANUP_BATCH_SIZE || '250' }}
      EXPECTED_ALLOWED_ORIGIN: ${{ vars.EXPECTED_ALLOWED_ORIGIN || 'https://bonaqu.github.io' }}
      EXPECT_EMAIL_VERIFICATION: ${{ vars.EXPECT_EMAIL_VERIFICATION || 'false' }}
      EXPECT_SMS_VERIFICATION: ${{ vars.EXPECT_SMS_VERIFICATION || 'false' }}
      EXPECT_TURNSTILE: ${{ vars.EXPECT_TURNSTILE || 'false' }}
      EXPECT_ADMIN_CONSOLE: ${{ vars.EXPECT_ADMIN_CONSOLE || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report Cloudflare deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'deployment/cloudflare',
              description: 'Building and smoke-testing the Cloudflare Free Worker stack',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Validate deployment credentials
        shell: bash
        run: |
          echo 'credentials' > cloudflare-deployment-stage.txt
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          echo 'dependencies' > cloudflare-deployment-stage.txt
          for attempt in 1 2 3; do
            npm ci --no-audit --no-fund && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: TypeScript check
        shell: bash
        run: |
          echo 'typescript-check' > cloudflare-deployment-stage.txt
          npm run check

      - name: Production build
        shell: bash
        run: |
          echo 'production-build' > cloudflare-deployment-stage.txt
          npm run build

      - name: Ensure D1 database exists
        shell: bash
        run: |
          echo 'resolve-d1' > cloudflare-deployment-stage.txt
          npx wrangler d1 list --json > d1.json
          D1_ID=$(node -e "const x=require('./d1.json'); const d=x.find(v=>v.name==='sql-academy'); if(d) process.stdout.write(d.uuid||d.id)")
          if [ -z "$D1_ID" ]; then
            npx wrangler d1 create sql-academy
            npx wrangler d1 list --json > d1.json
            D1_ID=$(node -e "const x=require('./d1.json'); const d=x.find(v=>v.name==='sql-academy'); if(d) process.stdout.write(d.uuid||d.id)")
          fi
          test -n "$D1_ID"
          echo "D1_ID=$D1_ID" >> "$GITHUB_ENV"

      - name: Ensure KV namespace exists
        shell: bash
        run: |
          echo 'resolve-kv' > cloudflare-deployment-stage.txt
          npx wrangler kv namespace list > kv.json
          KV_ID=$(node -e "const x=require('./kv.json'); const d=x.find(v=>String(v.title).toLowerCase().includes('sql-academy-settings')); if(d) process.stdout.write(d.id)")
          if [ -z "$KV_ID" ]; then
            npx wrangler kv namespace create sql-academy-settings
            npx wrangler kv namespace list > kv.json
            KV_ID=$(node -e "const x=require('./kv.json'); const d=x.find(v=>v.name==='sql-academy-settings' || String(v.title).toLowerCase().includes('sql-academy-settings')); if(d) process.stdout.write(d.id)")
          fi
          test -n "$KV_ID"
          echo "KV_ID=$KV_ID" >> "$GITHUB_ENV"

      - name: Generate free-tier production Wrangler config
        shell: bash
        run: |
          echo 'generate-wrangler-config' > cloudflare-deployment-stage.txt
          node - <<'NODE'
          const fs = require('fs');
          const config = {
            $schema: './node_modules/wrangler/config-schema.json',
            name: 'sql-learn-web-app',
            main: 'worker/index.ts',
            compatibility_date: '2026-07-27',
            compatibility_flags: ['nodejs_compat'],
            assets: {
              directory: './dist',
              binding: 'ASSETS',
              not_found_handling: 'single-page-application',
              run_worker_first: ['/api/*']
            },
            d1_databases: [{
              binding: 'DB',
              database_name: 'sql-academy',
              database_id: process.env.D1_ID,
              migrations_dir: 'migrations'
            }],
            kv_namespaces: [{ binding: 'SETTINGS', id: process.env.KV_ID }],
            ai: { binding: 'AI' },
            vars: {
              DIALECT_ENGINE_MODE: 'preview-only',
              ALLOWED_ORIGINS: process.env.ALLOWED_ORIGINS,
              FEATURE_EMAIL_VERIFICATION: process.env.FEATURE_EMAIL_VERIFICATION,
              FEATURE_SMS_VERIFICATION: process.env.FEATURE_SMS_VERIFICATION,
              FEATURE_TURNSTILE: process.env.FEATURE_TURNSTILE,
              FEATURE_ADMIN_CONSOLE: process.env.FEATURE_ADMIN_CONSOLE,
              CONTACT_REGISTRATION_POLICY: process.env.CONTACT_REGISTRATION_POLICY,
              TURNSTILE_EXPECTED_HOSTNAMES: process.env.TURNSTILE_EXPECTED_HOSTNAMES || '',
              ADMIN_ALLOWED_USER_IDS: process.env.ADMIN_ALLOWED_USER_IDS || '',
              RETENTION_CONTACT_EVENTS_DAYS: process.env.RETENTION_CONTACT_EVENTS_DAYS,
              RETENTION_UNCONSUMED_CONTACT_HOURS: process.env.RETENTION_UNCONSUMED_CONTACT_HOURS,
              RETENTION_CONSUMED_CHALLENGE_HOURS: process.env.RETENTION_CONSUMED_CHALLENGE_HOURS,
              RETENTION_EXPIRED_SESSION_HOURS: process.env.RETENTION_EXPIRED_SESSION_HOURS,
              RETENTION_CLEANUP_BATCH_SIZE: process.env.RETENTION_CLEANUP_BATCH_SIZE
            },
            observability: { enabled: true, head_sampling_rate: 1 }
          };
          fs.writeFileSync('wrangler.deploy.jsonc', JSON.stringify(config, null, 2));
          NODE

      - name: Validate production free-tier bundle
        shell: bash
        run: |
          echo 'wrangler-dry-run' > cloudflare-deployment-stage.txt
          npx wrangler deploy --dry-run --config wrangler.deploy.jsonc

      - name: Apply D1 migrations
        shell: bash
        run: |
          echo 'd1-migrations' > cloudflare-deployment-stage.txt
          npx wrangler d1 migrations apply sql-academy --remote --config wrangler.deploy.jsonc

      - name: Deploy Worker, D1/KV and static assets
        id: deploy
        shell: bash
        run: |
          echo 'worker-deploy' > cloudflare-deployment-stage.txt
          set -o pipefail
          npx wrangler deploy --config wrangler.deploy.jsonc 2>&1 | tee cloudflare-deploy.log
          DEPLOY_URL=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' cloudflare-deploy.log | tail -n 1)
          test -n "$DEPLOY_URL"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Smoke-test commercial runtime, CORS and hidden operator boundary
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo 'commercial-smoke' > cloudflare-deployment-stage.txt
          node scripts/commercial-runtime-production-smoke.mjs
          test -s cloudflare-commercial-stage.txt

      - name: Smoke-test Cloudflare frontend, auth and curriculum API
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo 'core-smoke' > cloudflare-deployment-stage.txt
          node scripts/cloudflare-production-smoke.mjs
          test -s cloudflare-smoke-stage.txt

      - name: Smoke-test full misconception answer history
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo 'concept-smoke' > cloudflare-deployment-stage.txt
          node scripts/concept-progress-production-smoke.mjs
          test -s cloudflare-concepts-stage.txt

      - name: Smoke-test executable checkpoint report lifecycle
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo 'checkpoint-smoke' > cloudflare-deployment-stage.txt
          node scripts/checkpoint-production-smoke.mjs
          test -s cloudflare-checkpoint-stage.txt

      - name: Smoke-test coordinated checkpoint attempt lifecycle
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo 'checkpoint-reservation-smoke' > cloudflare-deployment-stage.txt
          node scripts/checkpoint-reservation-production-smoke.mjs
          test -s cloudflare-checkpoint-reservation-stage.txt

      - name: Smoke-test immutable capstone report lifecycle
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo 'capstone-smoke' > cloudflare-deployment-stage.txt
          node scripts/capstone-production-smoke.mjs
          test -s cloudflare-capstone-stage.txt

      - name: Smoke-test privacy-first assessment calibration lifecycle
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo 'assessment-smoke' > cloudflare-deployment-stage.txt
          node scripts/assessment-calibration-production-smoke.mjs
          test -s cloudflare-assessment-calibration-stage.txt

      - name: Smoke-test privacy-first learning analytics lifecycle
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo 'analytics-smoke' > cloudflare-deployment-stage.txt
          node scripts/learning-analytics-production-smoke.mjs
          test -s cloudflare-learning-analytics-stage.txt

      - name: Smoke-test all server-dialect CI reference previews
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo 'dialect-smoke' > cloudflare-deployment-stage.txt
          npx tsx scripts/dialect-labs-free-production-smoke.ts
          test -s cloudflare-dialect-stage.txt

      - name: Smoke-test Mastery progress evidence lifecycle
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo 'mastery-smoke' > cloudflare-deployment-stage.txt
          node scripts/mastery-progress-production-smoke.mjs
          test -s cloudflare-mastery-stage.txt

      - name: Smoke-test onboarding profile lifecycle
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo 'onboarding-smoke' > cloudflare-deployment-stage.txt
          node scripts/onboarding-production-smoke.mjs
          test -s cloudflare-onboarding-stage.txt

      - name: Upload deployment diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-deployment-diagnostics-${{ github.run_attempt }}
          path: |
            cloudflare-deployment-stage.txt
            cloudflare-*.json
            cloudflare-*.txt
            cloudflare-*.html
            cloudflare-*.log
            ~/.npm/_logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Report Cloudflare deployment result
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const success = process.env.JOB_STATUS === 'success';
            let stage = '';
            try {
              stage = fs.readFileSync('cloudflare-deployment-stage.txt', 'utf8').trim();
            } catch {}
            const description = success
              ? 'Cloudflare Free deployed; commercial, privacy and dialect lifecycles verified'
              : `Cloudflare deployment failed${stage ? ` at ${stage}` : ''}`.slice(0, 140);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'deployment/cloudflare',
              description,
              target_url: success && process.env.DEPLOY_URL ? process.env.DEPLOY_URL : process.env.RUN_URL
            });
