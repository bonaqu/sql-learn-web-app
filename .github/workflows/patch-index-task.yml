name: Patch Composite Index Task

on:
  push:
    branches: [agent/curriculum-2-complete-syllabus]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/curriculum-2-complete-syllabus
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/patch-index-task.mjs
      - name: Commit patch
        shell: bash
        run: |
          rm -f scripts/patch-index-task.mjs .github/workflows/patch-index-task.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add unique composite-index planning task"
          git push origin HEAD:agent/curriculum-2-complete-syllabus
