name: Fix Graded Exam Patch

on:
  push:
    branches: [agent/curriculum-2-complete-syllabus]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/curriculum-2-complete-syllabus
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/fix-graded-exam-patch.mjs
      - name: Commit fix
        shell: bash
        run: |
          rm -f scripts/fix-graded-exam-patch.mjs .github/workflows/fix-graded-exam-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix graded exam integration literals"
          git push origin HEAD:agent/curriculum-2-complete-syllabus
