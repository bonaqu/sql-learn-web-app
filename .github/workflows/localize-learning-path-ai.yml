name: Localize Learning Path AI Context

on:
  pull_request:
    branches:
      - bonaqu_projects
    paths:
      - .github/workflows/localize-learning-path-ai.yml

permissions:
  contents: write

concurrency:
  group: localize-learning-path-ai-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  localize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout same-repository head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Validate and apply AI context migration
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/finalize-learning-path-ai-context.mjs
          node scripts/finalize-learning-path-ai-context.mjs
          rm scripts/finalize-learning-path-ai-context.mjs

      - name: Enforce changed-file allowlist
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git status --porcelain --untracked-files=all | cut -c4- | sort)
          expected=$(printf '%s\n' \
            'scripts/finalize-learning-path-ai-context.mjs' \
            'scripts/validate-learning-path.ts' \
            'src/components/LearningPathPortal.tsx' | sort)
          test "$changed" = "$expected"

      - name: Commit only AI context projection and guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/finalize-learning-path-ai-context.mjs scripts/validate-learning-path.ts src/components/LearningPathPortal.tsx
          git commit -m 'Project Learning Path AI context into Russian learner terms'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
