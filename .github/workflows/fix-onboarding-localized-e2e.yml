name: Fix Onboarding Localized E2E

on:
  pull_request:
    branches:
      - bonaqu_projects
    paths:
      - .github/workflows/fix-onboarding-localized-e2e.yml

permissions:
  contents: write

concurrency:
  group: fix-onboarding-localized-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout same-repository head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply exact E2E fix and remove script
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/fix-onboarding-localized-e2e.mjs
          node scripts/fix-onboarding-localized-e2e.mjs
          rm scripts/fix-onboarding-localized-e2e.mjs

      - name: Enforce changed-file allowlist
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git status --porcelain --untracked-files=all | cut -c4- | sort)
          expected=$(printf '%s\n' \
            'scripts/fix-onboarding-localized-e2e.mjs' \
            'tests/e2e/onboarding.spec.ts' | sort)
          test "$changed" = "$expected"

      - name: Commit only localized onboarding E2E expectations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/fix-onboarding-localized-e2e.mjs tests/e2e/onboarding.spec.ts
          git commit -m 'Align onboarding E2E with localized goal names'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
