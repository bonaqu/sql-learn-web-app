name: Fix analytics session fixture once

on:
  push:
    branches: [agent/commercial-readiness]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/commercial-readiness
          fetch-depth: 0
      - name: Bind seeded analytics to active session
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/learning-analytics.spec.ts')
          source = path.read_text(encoding='utf-8')
          old = """  await page.addInitScript(({ key, value }) => localStorage.setItem(key, JSON.stringify(value)), {
    key: `sql-academy-learning-analytics-v1:${userId}`,
    value: analyticsState(userId)
  });"""
          new = """  await page.addInitScript(({ key, sessionKey, sessionId, value }) => {
    localStorage.setItem(key, JSON.stringify(value));
    sessionStorage.setItem(sessionKey, sessionId);
  }, {
    key: `sql-academy-learning-analytics-v1:${userId}`,
    sessionKey: `sql-academy-learning-analytics-session-v1:${userId}`,
    sessionId: 'playwright-analytics-session',
    value: analyticsState(userId)
  });"""
          if source.count(old) != 1:
            raise SystemExit(f'expected one analytics seed fixture, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/fix-analytics-session-fixture-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/learning-analytics.spec.ts .github/workflows/fix-analytics-session-fixture-once.yml
          git diff --cached --check
          git commit -m "Bind analytics fixture to seeded session"
          git push origin HEAD:agent/commercial-readiness
