name: Contact Provider Staging Acceptance

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Real provider channel to verify
        required: true
        type: choice
        options:
          - email
          - sms
      deploy_gateway:
        description: Apply remote migrations and deploy the staging gateway first
        required: true
        type: boolean
        default: false

concurrency:
  group: contact-provider-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging-acceptance:
    name: ${{ inputs.channel }} real-provider delivery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: contact-provider-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONTACT_PROVIDER_STAGING_URL: ${{ secrets.CONTACT_PROVIDER_STAGING_URL }}
      CONTACT_PROVIDER_STAGING_SECRET: ${{ secrets.CONTACT_PROVIDER_STAGING_SECRET }}
      CONTACT_PROVIDER_STAGING_CHANNEL: ${{ inputs.channel }}
      CONTACT_PROVIDER_STAGING_DESTINATION: ${{ inputs.channel == 'email' && secrets.CONTACT_PROVIDER_STAGING_EMAIL || secrets.CONTACT_PROVIDER_STAGING_PHONE }}
      CONTACT_PROVIDER_EVIDENCE_PATH: ${{ runner.temp }}/contact-provider-staging-evidence.json
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate gateway before external delivery
        run: npm run validate:provider-gateway

      - name: Apply staging D1 migrations
        if: ${{ inputs.deploy_gateway }}
        run: npx wrangler d1 migrations apply sql-academy-contact-delivery-staging --remote --env staging --config provider-gateway/wrangler.jsonc

      - name: Deploy staging provider gateway
        if: ${{ inputs.deploy_gateway }}
        run: npx wrangler deploy --env staging --config provider-gateway/wrangler.jsonc

      - name: Require protected staging inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CONTACT_PROVIDER_STAGING_URL"
          test -n "$CONTACT_PROVIDER_STAGING_SECRET"
          test -n "$CONTACT_PROVIDER_STAGING_DESTINATION"

      - name: Send and verify real-provider challenge
        run: node scripts/contact-provider-staging-smoke.mjs

      - name: Upload redacted delivery evidence
        if: always() && hashFiles(format('{0}', env.CONTACT_PROVIDER_EVIDENCE_PATH)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: contact-provider-${{ inputs.channel }}-staging-evidence
          path: ${{ env.CONTACT_PROVIDER_EVIDENCE_PATH }}
          if-no-files-found: error
          retention-days: 3
