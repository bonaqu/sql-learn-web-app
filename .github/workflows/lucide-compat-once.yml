name: One-time Lucide compatibility patch

on:
  push:
    branches:
      - agent/lucide-react-1-27

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dependency branch
        uses: actions/checkout@v4
        with:
          ref: agent/lucide-react-1-27
          fetch-depth: 0

      - name: Replace removed brand icon export
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          source = app.read_text(encoding='utf-8')
          import_marker = '  Github,\n'
          usage_marker = '<Github size={17} />'

          if source.count(import_marker) != 1:
              raise SystemExit(f'Expected one Github import, found {source.count(import_marker)}')
          if source.count(usage_marker) != 1:
              raise SystemExit(f'Expected one Github usage, found {source.count(usage_marker)}')

          source = source.replace(import_marker, '', 1)
          source = source.replace(usage_marker, '<Code2 size={17} />', 1)
          app.write_text(source, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/lucide-compat-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/lucide-compat-once.yml
          git diff --cached --check
          git commit -m "Adapt GitHub link icon for Lucide 1.x"
          git push origin HEAD:agent/lucide-react-1-27
