name: Report Cloudflare Deployment Failure

on:
  workflow_run:
    workflows: ["Deploy Cloudflare Full Stack"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  report-failure:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish diagnostic failure status
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: 'failure',
              context: 'deployment/cloudflare',
              description: `Cloudflare deployment ${process.env.CONCLUSION} — open diagnostics`,
              target_url: process.env.RUN_URL
            });
