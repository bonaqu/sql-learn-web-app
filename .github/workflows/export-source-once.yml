name: Export source once

on:
  push:
    branches:
      - agent/commercial-readiness

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commercial branch
        uses: actions/checkout@v4
        with:
          ref: agent/commercial-readiness
          fetch-depth: 0

      - name: Create source snapshot
        run: |
          zip -qr sql-academy-source.zip . \
            -x '.git/*' 'node_modules/*' 'dist/*' 'sql-academy-source.zip'

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: sql-academy-source
          path: sql-academy-source.zip
          retention-days: 1

      - name: Remove one-time exporter
        run: |
          rm .github/workflows/export-source-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/export-source-once.yml
          git commit -m "Remove one-time source exporter"
          git push origin HEAD:agent/commercial-readiness
