name: Apply Curriculum Production Smoke

on:
  push:
    branches: [agent/structured-curriculum-project-lab]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structured-curriculum-project-lab
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/apply-curriculum-production-smoke.mjs
      - shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' .github/workflows/cloudflare.yml README.md | sort)"
          test "$changed" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/cloudflare.yml README.md
          git commit -m "Smoke-test curriculum API in Cloudflare production"
          git push origin HEAD:agent/structured-curriculum-project-lab
