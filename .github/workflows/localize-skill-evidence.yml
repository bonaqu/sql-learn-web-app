name: Localize Skill Evidence Explanations

on:
  pull_request:
    branches:
      - bonaqu_projects
    paths:
      - .github/workflows/localize-skill-evidence.yml

permissions:
  contents: write

concurrency:
  group: localize-skill-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  localize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout same-repository head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Validate and apply skill-evidence copy migration
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/finalize-skill-evidence-copy.mjs
          node scripts/finalize-skill-evidence-copy.mjs
          rm scripts/finalize-skill-evidence-copy.mjs

      - name: Enforce changed-file allowlist
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git status --porcelain --untracked-files=all | cut -c4- | sort)
          expected=$(printf '%s\n' \
            'scripts/finalize-skill-evidence-copy.mjs' \
            'scripts/validate-learning-path.ts' \
            'src/lib/skill-evidence.ts' | sort)
          test "$changed" = "$expected"

      - name: Commit only evidence explanations and guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/finalize-skill-evidence-copy.mjs scripts/validate-learning-path.ts src/lib/skill-evidence.ts
          git commit -m 'Localize skill-evidence blockers and completion criteria'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
