name: Finalize commercial readiness once

on:
  push:
    branches:
      - agent/commercial-readiness

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commercial branch
        uses: actions/checkout@v4
        with:
          ref: agent/commercial-readiness
          fetch-depth: 0

      - name: Fix analytics contrast and remove transport scaffolding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          css_path = Path('src/learning-analytics.css')
          css = css_path.read_text(encoding='utf-8')
          old = '''.learning-analytics-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            color: var(--accent);
            font-size: .78rem;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
          }
          '''
          new = '''.learning-analytics-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            color: var(--accent-2);
            font-size: .78rem;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
          }

          :root[data-theme='light'] .learning-analytics-kicker {
            color: var(--accent-hover);
          }
          '''
          if css.count(old) != 1:
              raise SystemExit(f'Expected one analytics kicker block, found {css.count(old)}')
          css_path.write_text(css.replace(old, new, 1), encoding='utf-8')
          PY

          rm -rf .github/commercial-patch
          rm -f .github/workflows/apply-commercial-readiness-once.yml
          rm -f .github/workflows/export-commercial-source-once.yml
          rm -f .github/workflows/finalize-commercial-readiness-once.yml

          git diff --check
          test ! -e .github/commercial-patch
          test ! -e .github/workflows/apply-commercial-readiness-once.yml
          test ! -e .github/workflows/finalize-commercial-readiness-once.yml

      - name: Commit clean product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize commercial UX and clean delivery scaffolding"
          git push origin HEAD:agent/commercial-readiness
