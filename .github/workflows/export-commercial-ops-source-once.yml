name: Export commercial operations source once

on:
  push:
    branches:
      - agent/commercial-operations-foundation

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/commercial-operations-foundation
          fetch-depth: 0

      - name: Build source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.github/workflows/export-commercial-ops-source-once.yml \
            --exclude='*.tsbuildinfo' \
            -czf commercial-ops-source.tar.gz .
          sha256sum commercial-ops-source.tar.gz > commercial-ops-source.sha256

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: commercial-ops-source
          path: |
            commercial-ops-source.tar.gz
            commercial-ops-source.sha256
          retention-days: 2
          if-no-files-found: error
