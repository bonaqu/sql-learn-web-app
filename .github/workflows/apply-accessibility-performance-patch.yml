name: Apply Accessibility Performance Patch

on:
  push:
    branches: [agent/accessibility-performance-pwa]

permissions:
  contents: write

concurrency:
  group: apply-accessibility-performance-patch
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/accessibility-performance-pwa
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Apply exact component patch
        run: node scripts/apply-accessibility-performance-patch.mjs

      - name: Verify only intended source files changed
        shell: bash
        run: |
          git diff --check
          git diff --exit-code -- .github/workflows/apply-accessibility-performance-patch.yml scripts/apply-accessibility-performance-patch.mjs
          EXPECTED=$(printf '%s\n' src/App.tsx src/components/AuthGate.tsx src/components/LearningPathPortal.tsx src/components/AssessmentCenterPortal.tsx | sort)
          ACTUAL=$(git diff --name-only | sort)
          test "$ACTUAL" = "$EXPECTED"

      - name: Commit component migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/components/AuthGate.tsx src/components/LearningPathPortal.tsx src/components/AssessmentCenterPortal.tsx
          git commit -m 'feat: add accessible lazy runtime boundaries'
          git push origin HEAD:agent/accessibility-performance-pwa
