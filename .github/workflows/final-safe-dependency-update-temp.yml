name: Final Safe Dependency Update Temporary

on:
  pull_request:
    branches:
      - bonaqu_projects

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'deps/final-safe-updates-2026-10-02'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install requested runtime update
        run: npm install --ignore-scripts --no-audit --no-fund --save "lucide-react@^1.50.0"

      - name: Install requested development updates
        run: npm install --ignore-scripts --no-audit --no-fund --save-dev "tsx@^4.23.15" "vite@^8.3.2"

      - name: Verify exact lockfile install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate dependency notices
        run: node scripts/generate-third-party-notices.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Commit final dependency update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json THIRD_PARTY_NOTICES.md docs/third-party-dependencies.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "deps: apply final safe dependency updates"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
