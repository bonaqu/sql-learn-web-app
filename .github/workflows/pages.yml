name: Deploy GitHub Pages

on:
  push:
    branches: [bonaqu_projects]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report Pages deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'deployment/github-pages',
              description: 'Building and smoke-testing GitHub Pages',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          echo 'dependencies' > pages-deployment-stage.txt
          for attempt in 1 2 3; do
            npm ci --no-audit --no-fund && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: TypeScript check
        shell: bash
        run: |
          echo 'typescript-check' > pages-deployment-stage.txt
          npm run check

      - name: Production build
        shell: bash
        run: |
          echo 'production-build' > pages-deployment-stage.txt
          npm run build

      - name: Record Pages configuration stage
        run: echo 'configure-pages' > pages-deployment-stage.txt

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Record artifact upload stage
        run: echo 'upload-pages-artifact' > pages-deployment-stage.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Record Pages deployment stage
        run: echo 'deploy-pages' > pages-deployment-stage.txt

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Smoke-test deployed Pages
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo 'pages-production-smoke' > pages-deployment-stage.txt
          test -n "$PAGE_URL"
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 5 --retry-all-errors \
            "$PAGE_URL" > deployed-pages.html
          grep -q '<div id="root"></div>' deployed-pages.html
          grep -q 'SQL Academy' deployed-pages.html

      - name: Upload Pages failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-deployment-diagnostics-${{ github.run_attempt }}
          path: |
            pages-deployment-stage.txt
            deployed-pages.html
            ~/.npm/_logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Report Pages deployment result
        if: always()
        uses: actions/github-script@v7
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const success = process.env.JOB_STATUS === 'success';
            let stage = '';
            try {
              stage = fs.readFileSync('pages-deployment-stage.txt', 'utf8').trim();
            } catch {}
            const description = success
              ? 'GitHub Pages deployed and smoke-tested'
              : `GitHub Pages failed${stage ? ` at ${stage}` : ''}`.slice(0, 140);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'deployment/github-pages',
              description,
              target_url: success && process.env.PAGE_URL ? process.env.PAGE_URL : process.env.RUN_URL
            });
