name: Dependency Lock Bootstrap

on:
  pull_request:
    branches:
      - bonaqu_projects
    paths:
      - package.json
      - scripts/generate-third-party-notices.mjs
      - scripts/validate-dependency-governance.mjs
      - .github/workflows/dependency-lock-bootstrap.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'agent/dependency-lock-notices' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate dependency inventory and notices
        run: node scripts/generate-third-party-notices.mjs

      - name: Verify generated outputs are stable
        run: node scripts/generate-third-party-notices.mjs --check

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json docs/third-party-dependencies.json THIRD_PARTY_NOTICES.md
          if git diff --cached --quiet; then
            echo "Generated dependency artifacts are already committed."
          else
            git commit -m "Commit deterministic dependency lock and notices"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Upload bootstrap outputs
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock-bootstrap-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            package-lock.json
            docs/third-party-dependencies.json
            THIRD_PARTY_NOTICES.md
