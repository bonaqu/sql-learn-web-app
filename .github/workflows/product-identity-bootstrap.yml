name: Product Identity Bootstrap

# One-time same-repository bootstrap; removed after the generated integration commit.
on:
  pull_request:
    branches:
      - bonaqu_projects
    paths:
      - scripts/apply-product-identity-bootstrap.mjs
      - .github/workflows/product-identity-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: product-identity-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install exact locked dependency tree
        run: npm ci --no-audit --no-fund

      - name: Apply identity bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-product-identity-bootstrap.mjs')
          source = path.read_text()
          start = source.index('readme += `')
          end = source.index("`;\nwrite('README.md', readme);", start)
          replacement = """readme += [
            '',
            '',
            '## Product identity и передача покупателю',
            '',
            'Публичное имя, track, описание, homepage, repository/support URL, лицензионная подпись и privacy label находятся в одном файле [`config/product-identity.json`](config/product-identity.json). После изменения выполняются `npm run identity:generate`, `npm run identity:check` и production build.',
            '',
            'Полная процедура ребрендинга, URL/security boundary и правило сохранения внутренних storage/API identifiers: [`docs/product-identity-handoff.md`](docs/product-identity-handoff.md).',
            '',
            '## Лицензия',
            '',
            'Исходный код распространяется по условиям файла [`LICENSE`](LICENSE) и не заявляется как open source. Сторонние зависимости сохраняют собственные лицензии и перечислены в [`THIRD_PARTY_NOTICES.md`](THIRD_PARTY_NOTICES.md).',
            ''
          ].join('\\n');
          write('README.md', readme);"""
          path.write_text(source[:start] + replacement + source[end + len("`;\nwrite('README.md', readme);"):])
          PY
          node scripts/apply-product-identity-bootstrap.mjs
          npx tsx scripts/generate-product-identity.ts

      - name: Commit generated integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Product identity integration is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html vite.config.ts src/App.tsx src/components/CommercialIdentityPortal.tsx README.md package.json package-lock.json public/manifest.webmanifest src/generated/product-identity.ts
          git commit -m 'Integrate buyer product identity across public surfaces'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
