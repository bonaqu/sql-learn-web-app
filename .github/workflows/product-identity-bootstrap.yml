name: Product Identity Bootstrap

on:
  push:
    branches:
      - agent/buyer-product-identity
    paths:
      - scripts/apply-product-identity-bootstrap.mjs
      - .github/workflows/product-identity-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: product-identity-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/buyer-product-identity
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install exact locked dependency tree
        run: npm ci --no-audit --no-fund

      - name: Apply identity bootstrap
        run: |
          node scripts/apply-product-identity-bootstrap.mjs
          npx tsx scripts/generate-product-identity.ts

      - name: Commit generated integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Product identity integration is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html vite.config.ts src/App.tsx src/components/CommercialIdentityPortal.tsx README.md package.json package-lock.json public/manifest.webmanifest src/generated/product-identity.ts
          git commit -m 'Integrate buyer product identity across public surfaces'
          git push origin HEAD:agent/buyer-product-identity
