name: Localize Guided Today

on:
  pull_request:
    branches:
      - bonaqu_projects
    paths:
      - .github/workflows/localize-guided-home.yml

permissions:
  contents: write

concurrency:
  group: localize-guided-home-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  localize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout same-repository head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply exact Today copy migration and remove script
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-guided-home-copy.mjs
          rm scripts/apply-guided-home-copy.mjs

      - name: Enforce changed-file allowlist
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git status --porcelain --untracked-files=all | cut -c4- | sort)
          expected=$(printf '%s\n' \
            'scripts/apply-guided-home-copy.mjs' \
            'scripts/validate-learning-journey.ts' \
            'src/components/GuidedHome.tsx' \
            'tests/e2e/guided-journey.spec.ts' | sort)
          test "$changed" = "$expected"

      - name: Commit only Today UI code and contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply-guided-home-copy.mjs scripts/validate-learning-journey.ts src/components/GuidedHome.tsx tests/e2e/guided-journey.spec.ts
          git commit -m 'Localize Today route language without changing journey IDs'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
