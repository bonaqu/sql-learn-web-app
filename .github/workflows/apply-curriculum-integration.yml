name: Apply Curriculum Integration Patch

on:
  push:
    branches: [agent/structured-curriculum-project-lab]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/structured-curriculum-project-lab
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply exact patch
        run: node scripts/apply-curriculum-integration.mjs
      - name: Verify expected files changed
        shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' src/App.tsx src/components/CurriculumPortal.tsx src/components/LearningPathPortal.tsx | sort)"
          test "$changed" = "$expected"
      - name: Commit integration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx src/components/CurriculumPortal.tsx src/components/LearningPathPortal.tsx
          git commit -m "Integrate curriculum studio into academy shell"
          git push origin HEAD:agent/structured-curriculum-project-lab
