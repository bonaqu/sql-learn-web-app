name: Export commercial source once

on:
  push:
    branches:
      - agent/commercial-readiness

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commercial branch
        uses: actions/checkout@v4
        with:
          ref: agent/commercial-readiness
          fetch-depth: 0

      - name: Create source snapshot
        run: |
          zip -qr sql-academy-commercial-source.zip . \
            -x '.git/*' 'node_modules/*' 'dist/*' 'sql-academy-commercial-source.zip'

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: sql-academy-commercial-source
          path: sql-academy-commercial-source.zip
          retention-days: 1

      - name: Record run and remove exporter
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > .commercial-source-run-id
          rm .github/workflows/export-commercial-source-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .commercial-source-run-id .github/workflows/export-commercial-source-once.yml
          git commit -m "Record commercial source export run $GITHUB_RUN_ID"
          git push origin HEAD:agent/commercial-readiness
