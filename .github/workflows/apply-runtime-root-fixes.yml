name: Apply Runtime Root Fixes

on:
  push:
    branches: [agent/accessibility-performance-pwa]

permissions:
  contents: write

concurrency:
  group: apply-runtime-root-fixes
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/accessibility-performance-pwa
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/apply-runtime-root-fixes.mjs
      - shell: bash
        run: |
          git diff --check
          git diff --exit-code -- .github/workflows/apply-runtime-root-fixes.yml scripts/apply-runtime-root-fixes.mjs
          EXPECTED=$(printf '%s\n' src/App.tsx src/components/AssessmentCenterPortal.tsx src/components/AuthGate.tsx tests/e2e/accessibility-pwa.spec.ts scripts/validate-bundle.mjs | sort)
          ACTUAL=$(git diff --name-only | sort)
          test "$ACTUAL" = "$EXPECTED"
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/components/AssessmentCenterPortal.tsx src/components/AuthGate.tsx tests/e2e/accessibility-pwa.spec.ts scripts/validate-bundle.mjs
          git commit -m 'fix: stabilize lazy feature and editor runtime boundaries'
          git push origin HEAD:agent/accessibility-performance-pwa
