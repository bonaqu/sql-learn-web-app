name: Integrate Graded Exams

on:
  push:
    branches: [agent/curriculum-2-complete-syllabus]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/curriculum-2-complete-syllabus
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/integrate-graded-exams.mjs
      - name: Commit integration
        shell: bash
        run: |
          rm -f scripts/integrate-graded-exams.mjs .github/workflows/integrate-graded-exams.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate diagnostic production and final exams"
          git push origin HEAD:agent/curriculum-2-complete-syllabus
